<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jogo da Coleta Seletiva</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <button class="icon-button" aria-label="Abrir menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <h1>Coleta Seletiva</h1>
        <button class="icon-button icon-button--close" aria-label="Fechar">
          ✕
        </button>
      </header>

      <section class="game__status">
        <div>
          <strong>Pontos:</strong> <span id="score">0</span>
        </div>
        <div>
          <strong>Erros:</strong> <span id="misses">0</span>
        </div>
        <div>
          <strong>Alvo:</strong> <span id="target">-</span>
        </div>
      </section>

      <section class="game__playfield" aria-live="polite">
        <div class="trash-can" aria-hidden="true">
          <svg viewBox="0 0 200 140" role="presentation">
            <ellipse cx="100" cy="30" rx="80" ry="20" fill="#696969" />
            <rect x="30" y="30" width="140" height="90" rx="30" fill="#7a7a7a" />
            <rect x="45" y="45" width="20" height="60" rx="8" fill="#bdbdbd" />
            <rect x="90" y="45" width="20" height="60" rx="8" fill="#bdbdbd" />
            <rect x="135" y="45" width="20" height="60" rx="8" fill="#bdbdbd" />
            <ellipse cx="100" cy="120" rx="75" ry="15" fill="#636363" />
            <circle cx="85" cy="55" r="12" fill="#fff" />
            <circle cx="115" cy="55" r="12" fill="#fff" />
            <circle cx="88" cy="56" r="6" fill="#111" />
            <circle cx="112" cy="56" r="6" fill="#111" />
            <path d="M80 85 Q100 95 120 85" stroke="#222" stroke-width="5" fill="none" />
          </svg>
        </div>
        <div class="falling-item" id="falling-item" aria-hidden="true"></div>
        <div class="ground"></div>
      </section>

      <section class="bins">
        <button class="bin bin--paper" data-type="papel">
          <span class="bin__bag"></span>
          <span class="bin__label">Papel</span>
        </button>
        <button class="bin bin--plastic" data-type="plastico">
          <span class="bin__bag"></span>
          <span class="bin__label">Plástico</span>
        </button>
        <button class="bin bin--glass" data-type="vidro">
          <span class="bin__bag"></span>
          <span class="bin__label">Vidro</span>
        </button>
        <button class="bin bin--metal" data-type="metal">
          <span class="bin__bag"></span>
          <span class="bin__label">Metal</span>
        </button>
        <button class="bin bin--organic" data-type="organico">
          <span class="bin__bag"></span>
          <span class="bin__label">Lixo</span>
        </button>
      </section>

      <section class="game__help">
        <p>
          Clique em uma lixeira para direcionar o lixo certo. Quando o item encostar no chão, ele será
          contabilizado na lixeira escolhida.
        </p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
